{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Déclarer une Absence - JESFOD{% endblock %}
{% block content %}
<div class="container mt-5 py-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow border-0 rounded-4">
        <div class="card-header bg-danger text-white py-3">
          <h4 class="mb-0"><i class="bi bi-person-x-fill me-2"></i>Déclarer une Absence</h4>
        </div>
        <div class="card-body p-4">
          <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
              <a href="{% url 'absence_list' %}" class="btn btn-outline-secondary">Annuler</a>
              <button type="submit" class="btn btn-danger">Enregistrer l'absence</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
